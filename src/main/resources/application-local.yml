spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/seniorproj_db
    username: sname
    password: senior
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # лучше 'validate' или 'none' с Flyway в будущем
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    locations: classpath:db/migration