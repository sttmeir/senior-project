spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/seniorproj_db  # или удалённый хост
    username: app_user
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # или none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: project

  flyway:
    enabled: false
    locations: classpath:db/migration