version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: seniorproj
    environment:
      POSTGRES_DB: seniorproj_db
      POSTGRES_USER: sname
      POSTGRES_PASSWORD: senior
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data: